name: Publish to PyPI

# Triggered on pushing a version tag (e.g. v0.1.0). Uses PyPI Trusted
# Publishing (OIDC) -- no API token is stored as a GitHub secret. Before
# this workflow can succeed, the PyPI project must have this repository
# and workflow filename registered as a trusted publisher (one-time
# manual setup on pypi.org; see PUBLICATION_PLAN.md Phase F).
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
